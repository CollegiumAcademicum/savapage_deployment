# SavaPage web app customization (manual ch. 20). Mounted read-only to
# /opt/savapage/server/custom/web.properties; paths are relative to custom/web/
# and custom/html/. Changes need a restart: systemctl restart savapage.service
webapp.style.default.enable=N
# User app only: the admin and job ticket apps are dense and broke under it.
webapp.custom.user=ca.css
webapp.html.user.login=user-login.html
webapp.html.admin.login=admin-login.html
